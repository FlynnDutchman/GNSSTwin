# Ambil ulang bangunan LOD1 dari OpenStreetMap dan simpan ke repo (jalankan manual dari tab Actions).
name: Perbarui bangunan LOD1 (OSM)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  lod1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/ambil_lod1.mjs public/data/bangunan_lod1.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add public/data/bangunan_lod1.json
          git diff --cached --quiet || git commit -m "Perbarui bangunan LOD1 dari OpenStreetMap"
          git push
